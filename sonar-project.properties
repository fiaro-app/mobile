sonar.projectKey=fiaro-app_mobile
sonar.organization=fiaro-app
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,docs/**
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Presentación pura (componentes, rutas, proveedores): sin lógica que medir; la lógica vive en src/lib y src/features, que sí se miden (M-02).
sonar.coverage.exclusions=src/components/**,src/app/**,src/providers/**,src/uniwind-types.d.ts
